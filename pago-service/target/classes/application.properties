spring.application.name=pago-service
server.port=8083

# JPA - gestion de base de datos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway - control de migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/db_pago_service
spring.datasource.username=root
spring.datasource.password=

# Microservicio
microservices.pedido.base-url=http://localhost:8082

#Control de loggs
logging.level.root=INFO
logging.level.com.lovable.pedido_service=DEBUG