spring.application.name=producto-service

# 1. Configuración del Puerto
server.port=8081

# 2. Configuración de la Conexión a Laragon (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/db_producto

# \?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuración de Hibernate / JPA
# Cambiamos a 'validate' porque Flyway creará la tabla desde el script SQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# 4. Configuración de Flyway (¡Encendido!)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration